# Use this when Render is connected to the Cursor-Popup repo (app at repo root).
# Root Directory in Render must be blank.
services:
  - type: web
    name: cursor-popup-portal
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20.18.1"
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CRON_SECRET
        sync: false

  # Daily spare referral reclaim (events past 14-day grace). Free plan.
  - type: cron
    name: sweep-spare-referral-codes
    runtime: node
    plan: free
    schedule: "0 15 * * *"
    buildCommand: "true"
    startCommand: node scripts/run-spare-referral-cron.mjs
    envVars:
      - key: NODE_VERSION
        value: "20.18.1"
      - key: PORTAL_URL
        sync: false
      - key: CRON_SECRET
        sync: false
